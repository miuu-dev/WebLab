<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuadrados Random Epilepsia</title>
</head>
<body>
    <script>

        for (let i = 0; i < 2000; i++) {
            let rojo = parseInt(Math.random()*256);
            let verde = parseInt(Math.random()*256);
            let azul = parseInt(Math.random()*256);
        
            let x = parseInt(Math.random() * screen.width);
            let y = parseInt(Math.random() * screen.height);

            document.write(`<div style="background-color: rgb(${rojo}, ${verde}, ${azul}); top:${y}px; left:${x}px; width: 50px; height: 50px; position: absolute";></div>`);
        }

    </script>
</body>
</html>
